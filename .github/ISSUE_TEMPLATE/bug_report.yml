name: Bug report
description: Report a reproducible Blackbox problem using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real databases, prompts, reports, attestations, review notes, signing keys, or credentials. Security vulnerabilities belong in a private GitHub Security Advisory."
  - type: input
    id: version
    attributes:
      label: Blackbox version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js and agent CLI versions
      description: Blackbox supports Node 22, 24, and 26. Include every configured adapter.
      placeholder: Node 24.5.0; Claude Code 2.1.119; Gemini CLI 0.x
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Recording adapter
      options: [Claude Code, Gemini CLI, Both, Import or internal event, Not adapter-related]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: blackbox doctor output
      description: Remove local paths, session/recorder identifiers, branch names, and other sensitive metadata before pasting.
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using npm run demo or synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
